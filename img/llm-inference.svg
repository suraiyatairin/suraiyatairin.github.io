<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Mixture-of-Experts LLM inference: a router sends a prompt to a few active experts spread across two GPUs, which produce the response" font-family="Arial, Helvetica, sans-serif">
