<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -18 240 240" role="img" aria-label="Research overview: an LLM at the center connected to AI/ML systems, generative AI, distributed computing, and applied AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf1f4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b3f56"/>
      <stop offset="1" stop-color="#4b1f2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0b45a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0b45a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="-18" width="240" height="240" rx="12" fill="url(#bg)"/>

  <!-- connections -->
  <g fill="none" stroke="#c58a9f" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round">
    <path d="M100 82 Q70 70 60 60"/>
    <path d="M140 82 Q170 70 180 60"/>
    <path d="M100 118 Q70 130 60 140"/>
    <path d="M140 118 Q170 130 180 140"/>
  </g>
  <g fill="#e0a13e">
    <circle cx="78" cy="72" r="3"/>
    <circle cx="162" cy="72" r="3"/>
    <circle cx="78" cy="128" r="3"/>
    <circle cx="162" cy="128" r="3"/>
  </g>

  <!-- center: LLM chip -->
  <circle cx="120" cy="100" r="44" fill="url(#glow)"/>
  <g stroke="#8b3f56" stroke-width="3" stroke-linecap="round">
    <line x1="108" y1="68" x2="108" y2="74"/><line x1="120" y1="68" x2="120" y2="74"/><line x1="132" y1="68" x2="132" y2="74"/>
    <line x1="108" y1="126" x2="108" y2="132"/><line x1="120" y1="126" x2="120" y2="132"/><line x1="132" y1="126" x2="132" y2="132"/>
    <line x1="88" y1="88" x2="94" y2="88"/><line x1="88" y1="100" x2="94" y2="100"/><line x1="88" y1="112" x2="94" y2="112"/>
    <line x1="146" y1="88" x2="152" y2="88"/><line x1="146" y1="100" x2="152" y2="100"/><line x1="146" y1="112" x2="152" y2="112"/>
  </g>
  <rect x="94" y="74" width="52" height="52" rx="10" fill="url(#chip)"/>
  <rect x="100" y="80" width="40" height="40" rx="7" fill="none" stroke="#e8b9c7" stroke-width="1.2" opacity="0.7"/>
  <text x="120" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">LLM</text>
  <path d="M137 80 l1.6 3.8 3.8 1.6 -3.8 1.6 -1.6 3.8 -1.6 -3.8 -3.8 -1.6 3.8 -1.6z" fill="#f3c46b"/>

  <!-- satellites -->
  <g fill="#ffffff" stroke="#c58a9f" stroke-width="2">
    <circle cx="42" cy="44" r="27"/>
    <circle cx="198" cy="44" r="27"/>
    <circle cx="42" cy="156" r="27"/>
    <circle cx="198" cy="156" r="27"/>
  </g>

  <!-- top-left: AI/ML systems (neural network) -->
  <g stroke="#8b3f56" stroke-width="1.3">
    <line x1="29" y1="36" x2="42" y2="31"/><line x1="29" y1="36" x2="42" y2="44"/><line x1="29" y1="36" x2="42" y2="57"/>
    <line x1="29" y1="52" x2="42" y2="31"/><line x1="29" y1="52" x2="42" y2="44"/><line x1="29" y1="52" x2="42" y2="57"/>
    <line x1="42" y1="31" x2="55" y2="36"/><line x1="42" y1="44" x2="55" y2="36"/><line x1="42" y1="57" x2="55" y2="36"/>
    <line x1="42" y1="31" x2="55" y2="52"/><line x1="42" y1="44" x2="55" y2="52"/><line x1="42" y1="57" x2="55" y2="52"/>
  </g>
  <g fill="#ffffff" stroke="#4b1f2f" stroke-width="2">
    <circle cx="29" cy="36" r="4"/><circle cx="29" cy="52" r="4"/>
    <circle cx="42" cy="31" r="4"/><circle cx="42" cy="44" r="4"/><circle cx="42" cy="57" r="4"/>
    <circle cx="55" cy="36" r="4"/><circle cx="55" cy="52" r="4"/>
  </g>

  <!-- top-right: Generative AI (sparkles + output tokens) -->
  <path d="M192 26 l3.4 8.6 8.6 3.4 -8.6 3.4 -3.4 8.6 -3.4 -8.6 -8.6 -3.4 8.6 -3.4z" fill="#8b3f56"/>
  <path d="M208 46 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#e0a13e"/>
  <g fill="#c58a9f">
    <rect x="180" y="58" width="9" height="5" rx="2"/>
    <rect x="191" y="58" width="13" height="5" rx="2"/>
  </g>

  <!-- bottom-left: Distributed computing (GPU servers) -->
  <g fill="#ffffff" stroke="#4b1f2f" stroke-width="2">
    <rect x="25" y="139" width="34" height="9" rx="2"/>
    <rect x="25" y="151" width="34" height="9" rx="2"/>
    <rect x="25" y="163" width="34" height="9" rx="2"/>
  </g>
  <g fill="#8b3f56">
    <circle cx="30" cy="143.5" r="1.6"/><circle cx="30" cy="155.5" r="1.6"/><circle cx="30" cy="167.5" r="1.6"/>
  </g>
  <g stroke="#c58a9f" stroke-width="2" stroke-linecap="round">
    <line x1="36" y1="143.5" x2="53" y2="143.5"/><line x1="36" y1="155.5" x2="53" y2="155.5"/><line x1="36" y1="167.5" x2="53" y2="167.5"/>
  </g>
  <circle cx="53" cy="167.5" r="2" fill="#e0a13e"/>

  <!-- bottom-right: Applied AI (road with detection box) -->
  <path d="M184 176 L193 136 L203 136 L212 176 Z" fill="#6f5a62"/>
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
    <line x1="198" y1="140" x2="198" y2="146"/><line x1="198" y1="152" x2="198" y2="159"/><line x1="198" y1="165" x2="198" y2="173"/>
  </g>
  <polyline points="190,164 193,160 196,163 199,158" fill="none" stroke="#2b1a20" stroke-width="1.4"/>
  <rect x="186" y="154" width="16" height="13" fill="none" stroke="#e0a13e" stroke-width="1.8"/>
<text x="42" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#8b3f56">AI/ML Systems</text><text x="198" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#8b3f56">Generative AI</text><text x="42" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#8b3f56">Distributed</text><text x="198" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#8b3f56">Applied AI</text>
</svg>
